<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Virtual Store</title>
<style>
:root{--bg:#dfe8f0;--blue:#1d4ed8;--red:#e11d2e;--chip:rgba(255,255,255,.92);--ink:#0f172a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2430;--chip:rgba(15,23,42,.92);--ink:#f1f5f9}}
:root[data-theme="dark"]{--bg:#1b2430;--chip:rgba(15,23,42,.92);--ink:#f1f5f9}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
.chip{position:fixed;background:var(--chip);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
#brand{top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;border-left:6px solid var(--red)}
#cart{top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;background:var(--blue);color:#fff}
#hint{bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:50%;transform:translateX(-50%);font-weight:500;white-space:nowrap}
#card{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translateX(-50%);background:var(--chip);color:var(--ink);border-radius:14px;padding:10px 12px;display:none;align-items:center;gap:12px;box-shadow:0 4px 16px rgba(0,0,0,.3);min-width:230px}
#card b{display:block;font-size:15px}#card span{font-size:13px;opacity:.75}
#card button{margin-left:auto;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-weight:700;font-size:14px}
#pad{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px}
#pad button{border:0;border-radius:12px;background:var(--chip);color:var(--ink);font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#co{position:fixed;top:calc(env(safe-area-inset-top,0px) + 56px);right:10px;background:var(--red);color:#fff;border:0;border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#pay{position:fixed;inset:0;background:rgba(15,23,42,.75);display:none;align-items:center;justify-content:center;z-index:5}
#pay>div{background:var(--chip);color:var(--ink);border-radius:18px;padding:26px 24px;text-align:center;max-width:300px;width:80%}
#ps{width:38px;height:38px;border:4px solid #cbd5e1;border-top-color:var(--blue);border-radius:50%;margin:0 auto 14px;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#pm{font-weight:700;font-size:17px}
#pb{margin-top:16px;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:700;font-size:14px}
@media (pointer:coarse){#pad{display:grid}#hint{display:none}}
</style>
</head>
<body>
<div class="chip" id="brand">Virtual Store</div>
<div class="chip" id="cart">Cart 0 · $0.00</div>
<button id="co">Checkout</button>
<div id="pay"><div><div id="ps"></div><div id="pm"></div><button id="pb">Keep shopping</button></div></div>
<div id="card"><div><b id="cn"></b><span id="cp"></span></div><button id="add">Add</button></div>
<div class="chip" id="hint">Arrow keys: walk and turn · stand by a shelf to see items · Space adds to cart</div>
<div id="pad"><span></span><button data-d="f">▲</button><span></span><button data-d="l">◀</button><button data-d="b">▼</button><button data-d="r">▶</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const STORE="VIRTUAL STORE";
/* Prices in USD. */
const ROWS=[
 {n:"HOME CARE",items:[["Dish Soap 12 oz",1.99],["Laundry Detergent",5.99],["Paper Towels 2 rolls",2.99],["Bleach 64 oz",2.49],["Sponges 4 pack",1.99],["Trash Bags 15 ct",3.49]]},
 {n:"DAILY ESSENTIALS",items:[["White Rice 2 lb",2.15],["Flour 5 lb",2.75],["Vegetable Oil 48 oz",3.99],["Sugar 4 lb",3.29],["Spaghetti 1 lb",1.32],["Canned Beans 15 oz",0.99]]},
 {n:"SNACKS",items:[["Potato Chips",2.99],["Chocolate Bar",1.29],["Cookies 12 oz",3.89],["Popcorn 3 pack",1.99],["Peanuts 16 oz",3.29],["Crackers",2.19]]},
 {n:"DRINKS",items:[["Orange Juice 52 oz",3.49],["Cola 2 L",2.99],["Water 24 pack",3.99],["Black Tea 20 bags",2.29],["Instant Coffee 3 oz",4.49],["Milk 1 gal",3.79]]}
];
const RX=[-12,-4,4,12],Z0=-26,N=80,ZEND=18,SEG=14;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xdfe8f0);scene.fog=new THREE.Fog(0xdfe8f0,22,65);
const cam=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,100);
cam.position.set(0,2.7,32.3);
const ren=new THREE.WebGLRenderer({antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);
document.body.prepend(ren.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0xb8c0cc,1.05));
const dl=new THREE.DirectionalLight(0xffffff,.35);dl.position.set(4,10,6);scene.add(dl);
const M=c=>new THREE.MeshLambertMaterial({color:c});
function box(w,h,d,c,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);scene.add(m);return m}
function tex(t,bg,fs){const c=document.createElement("canvas");c.width=512;c.height=128;const g=c.getContext("2d");g.fillStyle=bg;g.fillRect(0,0,512,128);g.fillStyle="#fff";g.font="bold "+fs+"px Arial,sans-serif";g.textAlign="center";g.textBaseline="middle";g.fillText(t,256,68);return new THREE.CanvasTexture(c)}
function sign(t,bg,fs,x,y,z,w,h){[0,Math.PI].forEach(r=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex(t,bg,fs)}));m.position.set(x,y,z);m.rotation.y=r;m.translateZ(.02);scene.add(m)})}
function ptex(name,hue){
 const c=document.createElement("canvas");c.width=c.height=128;const g=c.getContext("2d");
 g.fillStyle="hsl("+hue+",70%,45%)";g.fillRect(0,0,128,128);
 g.fillStyle="#fff";g.fillRect(12,30,104,66);
 g.fillStyle="#111";g.font="bold 17px Arial,sans-serif";g.textAlign="center";g.textBaseline="middle";
 const w=name.split(" ");const ls=[];let cur="";
 w.forEach(x=>{if((cur+" "+x).trim().length>9&&cur){ls.push(cur);cur=x}else cur=(cur+" "+x).trim()});ls.push(cur);
 ls.slice(0,3).forEach((l,i,a)=>g.fillText(l,64,63+(i-(a.length-1)/2)*20));
 return new THREE.CanvasTexture(c)}
// shell
box(34,.1,64,0xf4f4f1,0,-.05,2);
box(34,.1,64,0xffffff,0,4.05,2);
box(.2,4,64,0xeef2f7,-17,2,2);box(.2,4,64,0xeef2f7,17,2,2);
box(34,4,.2,0xeef2f7,0,2,-30);box(34,4,.2,0xeef2f7,0,2,34);
[-17,17].forEach(x=>{box(.25,.5,64,0x1d4ed8,x,3.5,2);box(.25,.12,64,0xe11d2e,x,3.1,2)});
for(let x=-16;x<=16;x+=4)box(.18,.04,64,0xe11d2e,x,3.98,2);
sign(STORE,"#1d4ed8",54,0,3.3,-29.8,10,2.5);
// shelves with real products
const pgeo=new THREE.BoxGeometry(.42,.5,.42),dummy=new THREE.Object3D();
function itemAt(ri,side,l,i){return ROWS[ri].items[(Math.floor(i/SEG)+l+(side>0?3:0))%6]}
ROWS.forEach((row,ri)=>{
 const rx=RX[ri],len=N*.55+.5,cz=Z0+len/2-.3;
 box(1.3,.45,len,0x1d4ed8,rx,.22,cz);
 box(.12,3.3,len,0x1d4ed8,rx,1.65,cz);
 for(let l=0;l<4;l++)box(1.3,.05,len,0xffffff,rx,.5+l*.7,cz);
 box(1.4,.12,len,0xe11d2e,rx,3.3,cz);
 box(1.5,1.1,.9,0xe11d2e,rx,.55,ZEND+1.3);
 const lists=row.items.map(()=>[]);
 for(let s=-1;s<=1;s+=2)for(let l=0;l<4;l++)for(let i=0;i<N;i++){
  const k=(Math.floor(i/SEG)+l+(s>0?3:0))%6;lists[k].push([rx+s*.38,.8+l*.7,Z0+i*.55])}
 lists.forEach((L,k)=>{
  const im=new THREE.InstancedMesh(pgeo,new THREE.MeshLambertMaterial({map:ptex(row.items[k][0],(k*55+ri*25)%360)}),L.length);
  L.forEach((p,j)=>{dummy.position.set(p[0],p[1],p[2]);dummy.updateMatrix();im.setMatrixAt(j,dummy.matrix)});
  scene.add(im)});
 [ZEND+.5,-8].forEach(z=>sign(row.n,"#1d4ed8",row.n.length>12?40:54,rx,3.65,z,3.6,.9));
});
// avatar
const av=new THREE.Group();scene.add(av);
function mk(g,w,h,d,c,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);g.add(m);return m}
function limb(x,y,w,h,c){const p=new THREE.Group();p.position.set(x,y,0);mk(p,w,h,w,c,0,-h/2,0);av.add(p);return p}
const legL=limb(-.12,.85,.2,.85,0x1e3a8a),legR=limb(.12,.85,.2,.85,0x1e3a8a);
const armL=limb(-.34,1.45,.15,.6,0xc68642),armR=limb(.34,1.45,.15,.6,0xc68642);
mk(av,.5,.6,.28,0x0ea5a4,0,1.15,0);
mk(av,.08,.08,.08,0xc68642,0,1.5,0);
const head=new THREE.Mesh(new THREE.SphereGeometry(.17,16,12),M(0xc68642));head.position.set(0,1.68,0);av.add(head);
mk(av,.34,.1,.34,0x2b1b12,0,1.82,0);
mk(av,.05,.05,.03,0x111111,-.06,1.7,-.16);mk(av,.05,.05,.03,0x111111,.06,1.7,-.16);
av.position.set(0,0,28);
// controls: arrow keys (and WASD) or on-screen pad
let ang=0,phase=0;const key={},mv={};
addEventListener("keydown",e=>{key[e.code]=1;if(e.code==="Space"||e.code==="Enter"){e.preventDefault();addItem()}if(e.code.startsWith("Arrow"))e.preventDefault()});
addEventListener("keyup",e=>key[e.code]=0);
document.querySelectorAll("#pad button").forEach(b=>{const k=b.dataset.d;
 b.addEventListener("pointerdown",e=>{e.preventDefault();mv[k]=1});
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>mv[k]=0))});
// cart + nearby item
let target=null,count=0,total=0;
function addItem(){if(!target||pay.style.display==="flex")return;count++;total+=target[1];cart.textContent="Cart "+count+" · $"+total.toFixed(2)}
add.addEventListener("click",addItem);
let paying=false;
co.addEventListener("click",()=>{
 if(paying)return;
 pay.style.display="flex";
 if(!count){ps.style.display="none";pm.textContent="Your cart is empty";pb.style.display="";return}
 paying=true;const amt=total.toFixed(2);
 ps.style.display="";pb.style.display="none";pm.textContent="Processing payment of $"+amt+"…";
 setTimeout(()=>{paying=false;ps.style.display="none";pm.textContent="You have successfully paid $"+amt;pb.style.display="";count=0;total=0;cart.textContent="Cart 0 · $0.00"},3000);
});
pb.addEventListener("click",()=>{pay.style.display="none"});
function nearby(){
 const p=av.position;target=null;
 RX.forEach((rx,ri)=>{if(Math.abs(p.x-rx)<2.4&&p.z>Z0-1&&p.z<ZEND+.5){
  const i=Math.max(0,Math.min(N-1,Math.round((p.z-Z0)/.55)));
  target=itemAt(ri,p.x>=rx?1:-1,1,i)}});
 if(target){cn.textContent=target[0];cp.textContent="$"+target[1].toFixed(2)+" · tap Add or press Space";card.style.display="flex"}
 else card.style.display="none";
}
// loop
let last=performance.now(),fr=0;const camT=new THREE.Vector3();
function loop(t){
 requestAnimationFrame(loop);
 const dt=Math.min((t-last)/1000,.05);last=t;
 const f=(key.ArrowUp||key.KeyW||mv.f?1:0)-(key.ArrowDown||key.KeyS||mv.b?1:0);
 const s=(key.ArrowLeft||key.KeyA||mv.l?1:0)-(key.ArrowRight||key.KeyD||mv.r?1:0);
 ang+=s*2.3*dt;
 const p=av.position;
 p.x+=-Math.sin(ang)*f*3.6*dt;p.z+=-Math.cos(ang)*f*3.6*dt;
 p.x=Math.max(-16,Math.min(16,p.x));p.z=Math.max(-29,Math.min(33,p.z));
 if(p.z<ZEND+2.2)RX.forEach(rx=>{if(Math.abs(p.x-rx)<1.15)p.x=rx+(p.x>=rx?1.15:-1.15)});
 av.rotation.y=ang;
 const moving=f!==0;
 if(moving)phase+=dt*9;
 const sw=moving?Math.sin(phase):0;
 legL.rotation.x=sw*.7;legR.rotation.x=-sw*.7;armL.rotation.x=-sw*.6;armR.rotation.x=sw*.6;
 camT.set(p.x+Math.sin(ang)*4.3,2.7,p.z+Math.cos(ang)*4.3);
 cam.position.lerp(camT,Math.min(1,dt*6));
 cam.position.x=Math.max(-16.6,Math.min(16.6,cam.position.x));cam.position.z=Math.max(-29.6,Math.min(33.6,cam.position.z));
 cam.lookAt(p.x-Math.sin(ang)*1.5,1.2,p.z-Math.cos(ang)*1.5);
 if(++fr%5==0)nearby();
 ren.render(scene,cam);
}
addEventListener("resize",()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
loop(performance.now());
</script>
</body>
</html>
